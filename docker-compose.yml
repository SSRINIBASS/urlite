services:
  db:
    image: postgres:15-alpine
    container_name: url-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-urlite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-urlite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network

  backend:
    build: ./server
    container_name: url-backend
    restart: unless-stopped
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks:
      - app-network

  frontend:
    build: ./client
    container_name: url-frontend
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    build: ./nginx
    container_name: url-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: url-redis
    restart: unless-stopped
    networks:
      - app-network

  worker:
    build: ./worker
    container_name: url-worker
    restart: unless-stopped
    depends_on:
      - redis
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    networks:
      - app-network

  # Optional: enable with docker compose --profile tunnel up -d.
  # Keep the tunnel token in the local .env file; never commit it.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: url-tunnel
    profiles:
      - tunnel
    restart: unless-stopped
    command: tunnel run --token ${TUNNEL_TOKEN:-}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
